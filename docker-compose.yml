services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
    environment:
      - SECRET_KEY=change-me-in-production
      - DEBUG=True
      - DB_PATH=/app/db/db.sqlite3
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
